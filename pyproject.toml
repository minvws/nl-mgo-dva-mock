[tool.poetry]
name = "dva-mock"
version = "0.8.0"
description = "Mock for Client SDK providing mock FHIR data."
license = "EUPL-1.2"
authors = ["Ministerie van Volksgezondheid, Welzijn en Sport"]
repository = "https://github.com/minvws/nl-mgo-dva-mock-private"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
uvicorn = ">=0.42,<0.45"
fastapi = ">=0.135,<0.137"
mypy = "^1.19"
requests = "^2.33"
opentelemetry-instrumentation-fastapi = "v0.49b0"
opentelemetry-exporter-otlp = "^1.27.0"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
inject = "^5.3.0"
numpy = "^2.3.4"
pillow = "^12.0.0"
pydicom = "^3.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
httpx = "^0.28.1"
ruff = "^0.15"
faker = "^40.13"
codespell = "^2.4.2"
pytest-mock = "^3.15.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
cache-dir = "~/.cache/ruff"
include = [
    "pyproject.toml",
    "app/*.py",
    "tests/*.py",
]

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest".msg = "use pytest-mock instead"

[tool.mypy]
files = "app,tests"
python_version = "3.12"
strict = true
cache_dir = "~/.cache/mypy"

[tool.pytest.ini_options]
cache_dir = "~/.cache/pytest"
testpaths = [
    "tests",
]


[tool.codespell]
skip = [
    "./certs/*",
    "./static/*.js",
    "./static/bbs-client/app.js",
    "./static/bbs-client/index.html",
    "./static/bbs-client/styles.css",
    "./fhir/resources/*",
    "./temp/*"
]
